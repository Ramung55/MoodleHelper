          - completed
          - failed
          - cancelled
        attempts:
          type: integer
          minimum: 0
        generation:
          type: integer
          minimum: 0
        errorCode: &id043
          type: string
          enum:
          - signed_out
          - request_failed
          - invalid_context
      required:
      - id
      - courseId
      - state
      - attempts
      - generation
    ScanRun:
      type: object
      additionalProperties: false
      properties:
        id: &id029
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        idempotencyKey: *id029
        courseIds:
          type: array
