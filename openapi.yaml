    QueueCurrent:
      type: object
      additionalProperties: false
      properties:
        courseIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 8192, pattern: '\S'}
        run:
          $ref: '#/components/schemas/QueueRun'
        lastFailedRun:
          $ref: '#/components/schemas/QueueRun'
      required: [courseIds]
    QueueStart:
      description: Start a run for 1-100 distinct existing course IDs in the trusted
        startup namespace. IDs are sorted for idempotency comparison. Reusing a key
        with a different set returns 409; unknown IDs return 422 without side effects.
        Queue requests have a 1 MiB body limit.
      type: object
      additionalProperties: false
      properties:
        idempotencyKey: &id012
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        courseIds:
          type: array
          items: &id014
            type: string
            minLength: 1
            maxLength: 8192
            pattern: \S
          minItems: 1
          maxItems: 100
          uniqueItems: true
      required:
      - idempotencyKey
      - courseIds
    QueueClaimInput:
      type: object
      additionalProperties: false
      properties: {}
    QueueClaimToken:
      type: object
      additionalProperties: false
      properties:
        jobId: *id012
        generation:
          type: integer
          minimum: 1
        token: *id012
      required:
      - jobId
      - generation
      - token
    QueueFinish:
      description: Finish a current, unexpired claim. A failed outcome requires errorCode
        mock_failure; a completed outcome must omit errorCode. Stale or fenced claims
        return 409. Result insertion and completion commit atomically.
      type: object
      additionalProperties: false
      properties:
        jobId: *id012
        generation:
          type: integer
          minimum: 1
        token: *id012
        outcome:
          type: string
          enum:
          - completed
          - failed
        errorCode:
          type: string
          const: mock_failure
      required:
      - jobId
      - generation
      - token
      - outcome
    QueueProgress:
      type: object
      additionalProperties: false
      properties:
        pending: &id013
          type: integer
          minimum: 0
        running: *id013
        completed: *id013
        failed: *id013
        cancelled: *id013
        total: *id013
      required:
      - pending
      - running
      - completed
      - failed
      - cancelled
      - total
    QueueResult:
      type: object
      additionalProperties: false
      properties:
        id: *id012
        summary:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - id
      - summary
    QueueJob:
      type: object
      additionalProperties: false
      properties:
        id: *id012
        courseId: *id014
        state: &id015
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
