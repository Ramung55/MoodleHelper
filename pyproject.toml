[project]
name = "moodle-helper-backend"
version = "0.1.0"
description = "Local in-memory Moodle Helper API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyyaml>=6,<7", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
