    OverlayPatch:
      type: object
      properties:
        titleOverride:
          oneOf:
          - type: string
          - type: 'null'
        dateOverride:
          anyOf:
          - $ref: '#/components/schemas/DateValue'
          - type: 'null'
        overrideBase:
          anyOf:
          - $ref: '#/components/schemas/DateValue'
          - type: 'null'
        hidden:
          type: boolean
        completed:
          type: boolean
      description: Omitted fields are unchanged. Explicit null clears an optional
