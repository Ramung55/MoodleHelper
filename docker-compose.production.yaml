# Private Tailscale deployment (#137): one app container on loopback; `tailscale serve`
# on the host terminates HTTPS. Runbook: _docs/oracle-deployment.md
services:
  app:
    # Deploys pull the CI-tested image by commit SHA (scripts/deploy.sh writes .env.release);
    # without a tag, `up --build` builds locally as :local.
    image: ghcr.io/ramung55/moodlehelper:${MOODLE_HELPER_RELEASE:-local}
    build: .
    restart: unless-stopped
    # No MOODLE_HELPER_DATABASE_URL: the image default is SQLite at /data/moodle-helper.sqlite3.
    environment:
      - MOODLE_HELPER_TAILNET_HOST=${MOODLE_HELPER_TAILNET_HOST:?Set MOODLE_HELPER_TAILNET_HOST to the VM's <machine>.<tailnet>.ts.net name}
      - MOODLE_HELPER_TAILNET_PORT
      - MOODLE_HELPER_RELEASE=${MOODLE_HELPER_RELEASE:-local}
      - MOODLE_HELPER_DATASET
      - MOODLE_HELPER_MOODLE_ORIGIN
      - MOODLE_HELPER_PROFILE_LABEL
      - MOODLE_HELPER_STABLE_USER_ID
      - MOODLE_HELPER_AI_PROVIDER
      - MOODLE_HELPER_AI_MODEL
      - MOODLE_HELPER_AI_LEDGER_PATH
      - GROQ_API_KEY
      - GEMINI_API_KEY
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-data: {}
