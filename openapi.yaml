  responses:
    ProposedHttpFailure:
      description: Proposed HTTP failure convention only. The current frontend rejects
        promises or shows an Error.message; it does not define HTTP status codes or
        an error envelope. Inline domain outcomes such as unsupported imports/downloads
        remain successful 200 wrapper responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProposedHttpError'
    BridgeContextChanged:
      description: Backend process changed; reconnect without replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProposedHttpError'
  parameters:
    BridgeBinding:
      name: X-Moodle-Helper-Bridge-Binding
      in: header
      required: false
      description: Optional process binding precondition. Absence preserves legacy
        clients; mismatch rejects before parsing or service work.
      schema:
        type: string
