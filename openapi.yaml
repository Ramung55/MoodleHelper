components:
  schemas:
    QueueStart:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey: &queueschema001
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        courseIds:
          type: array
          items: &queueschema003
            type: string
            minLength: 1
            maxLength: 8192
            pattern: '\S'
          minItems: 1
          maxItems: 100
          uniqueItems: true
      required:
      - idempotencyKey
      - courseIds
    QueueClaimInput:
      type: object
      additionalProperties: false
      properties: {}
    QueueClaimToken:
      type: object
      additionalProperties: false
      properties:
        jobId: *queueschema001
        generation:
          type: integer
          minimum: 1
        token: *queueschema001
      required:
      - jobId
      - generation
      - token
    QueueFinish:
      type: object
      additionalProperties: false
      properties:
        jobId: *queueschema001
        generation:
          type: integer
          minimum: 1
        token: *queueschema001
        outcome:
          type: string
          enum:
          - completed
          - failed
        errorCode:
          type: string
          const: mock_failure
      required:
      - jobId
      - generation
      - token
      - outcome
    QueueProgress:
      type: object
      additionalProperties: false
      properties:
        pending: &queueschema002
          type: integer
          minimum: 0
        running: *queueschema002
        completed: *queueschema002
        failed: *queueschema002
        cancelled: *queueschema002
        total: *queueschema002
      required:
      - pending
      - running
      - completed
      - failed
      - cancelled
      - total
    QueueResult:
      type: object
      additionalProperties: false
      properties:
        id: *queueschema001
        summary:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - id
      - summary
    QueueJob:
      type: object
      additionalProperties: false
      properties:
        id: *queueschema001
        courseId: *queueschema003
        state: &queueschema004
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
        attempts: *queueschema002
        generation: *queueschema002
        errorCode:
          type: string
          const: mock_failure
        result:
          $ref: '#/components/schemas/QueueResult'
      required:
      - id
      - courseId
      - state
      - attempts
      - generation
    QueueRun:
      type: object
      additionalProperties: false
      properties:
        id: *queueschema001
        idempotencyKey: *queueschema001
        courseIds:
          type: array
          items: *queueschema003
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdAt: *queueschema002
        status: *queueschema004
        cancelled:
          type: boolean
        progress:
          $ref: '#/components/schemas/QueueProgress'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/QueueJob'
          maxItems: 100
        nextCursor: *queueschema001
      required:
      - id
      - idempotencyKey
      - courseIds
      - createdAt
      - status
      - cancelled
      - progress
      - jobs
    QueueClaim:
      type: object
      additionalProperties: false
      properties:
        job:
          $ref: '#/components/schemas/QueueJob'
        token: *queueschema001
        generation:
          type: integer
          minimum: 1
        expiresAt: *queueschema002
      required:
      - job
      - token
      - generation
      - expiresAt
    QueueClaimResponse:
      type: object
      additionalProperties: false
      properties:
        claim:
          $ref: '#/components/schemas/QueueClaim'
        unfinished:
          type: boolean
      required:
      - unfinished
    QueueRenewResponse:
      type: object
      additionalProperties: false
      properties:
        expiresAt: *queueschema002
      required:
      - expiresAt
    DateValue:
      oneOf:
      - $ref: '#/components/schemas/ExactDate'
      - $ref: '#/components/schemas/CalendarDate'
      - $ref: '#/components/schemas/TeachingWeek'
      - $ref: '#/components/schemas/UnknownDate'
      discriminator:
        propertyName: kind
        mapping:
          exact: '#/components/schemas/ExactDate'
          date: '#/components/schemas/CalendarDate'
          week: '#/components/schemas/TeachingWeek'
          unknown: '#/components/schemas/UnknownDate'
      description: The four frontend date forms. Do not replace date-only, teaching-week,
        or unknown values with invented exact timestamps.
    ExactDate:
      type: object
      properties:
        kind:
          const: exact
          type: string
        iso:
          type: string
          description: Exact-time string. The frontend schema accepts any string;
            this contract does not add date-time validation.
        tz:
          type: string
          description: Timezone string; not constrained to a particular registry by
            the frontend schema.
      required:
      - kind
      - iso
      - tz
    CalendarDate:
      type: object
      properties:
        kind:
          const: date
          type: string
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
      - kind
      - date
    TeachingWeek:
      type: object
      properties:
        kind:
          const: week
          type: string
        week:
          type: integer
          minimum: 1
          maximum: 30
      required:
      - kind
      - week
    UnknownDate:
      type: object
      properties:
        kind:
          const: unknown
          type: string
        note:
          type: string
      required:
      - kind
    AssessmentType:
      type: string
      enum:
      - assignment
      - quiz
      - exam
      - other
    SubmissionStatus:
      type: string
      enum:
      - submitted
      - draft
      - not_submitted
      - reopened
      - unknown
    ConnectionState:
      type: string
      enum:
      - demo
      - connected
      - disconnected
      - error
    KnownString:
      type: object
      properties:
        kind:
          type: string
          const: known
        value: &id002
          type: string
      required:
      - kind
      - value
    KnownStrings:
      type: object
      properties:
        kind:
          type: string
          const: known
        value:
          type: array
          items: *id002
      required:
      - kind
      - value
    UnknownFact:
      type: object
      properties:
        kind:
          type: string
          const: unknown
      required:
      - kind
    RawCourseObservation:
      type: object
      properties:
        sourceCourseId: *id002
        sourceUrl: *id002
        title: &id003
          oneOf:
          - $ref: '#/components/schemas/KnownString'
          - $ref: '#/components/schemas/UnknownFact'
          discriminator:
            propertyName: kind
        termIndicators: &id004
          oneOf:
          - $ref: '#/components/schemas/KnownStrings'
          - $ref: '#/components/schemas/UnknownFact'
          discriminator:
            propertyName: kind
      required:
      - sourceCourseId
      - sourceUrl
      - title
      - termIndicators
    CourseDiscovery:
      type: object
      properties:
        sourceCourseId: *id002
        sourceUrl: *id002
        title: *id003
        termIndicators: *id004
        currentTermStatus:
          type: string
          enum:
          - current
          - past
          - unknown
      required:
      - sourceCourseId
      - sourceUrl
      - title
      - termIndicators
      - currentTermStatus
    CourseDiscoveryInput:
      type: object
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/RawCourseObservation'
      required:
      - observations
    Course:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        color:
          type: integer
          minimum: 1
          maximum: 6
        discovery:
          $ref: '#/components/schemas/CourseDiscovery'
        current:
          type: boolean
      required:
      - id
      - code
      - name
      - color
      - current
    SourceEvidence:
      type: object
      properties:
        source:
          type: string
          enum:
          - moodle
          - syllabus
          - personal
        date:
          $ref: '#/components/schemas/DateValue'
        excerpt:
          type: string
        location:
          type: string
        url:
          type: string
        observedAt:
          type: string
      required:
      - source
      - date
      - observedAt
    SubmissionObservation:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        evidence:
          type: string
        observedAt:
          type: string
      required:
      - status
      - observedAt
    Assessment:
      type: object
      properties:
        id:
          type: string
        activityId:
          type: string
        courseId:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/AssessmentType'
        availableFrom:
          type: string
          description: Moodle quiz or assignment opening time when known.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceEvidence'
          minItems: 1
        submission:
          $ref: '#/components/schemas/SubmissionObservation'
        personal:
          type: boolean
          default: false
        firstObservedAt:
          type: string
        lastObservedAt:
          type: string
      required:
      - id
      - courseId
      - title
      - type
      - sources
      - personal
      - firstObservedAt
      - lastObservedAt
    Overlay:
      type: object
      properties:
        assessmentId:
          type: string
        titleOverride:
          type: string
        dateOverride:
          $ref: '#/components/schemas/DateValue'
        overrideBase:
          $ref: '#/components/schemas/DateValue'
          description: Source date when the override was set; used for change detection.
        hidden:
          type: boolean
          default: false
        completed:
          type: boolean
          default: false
      required:
      - assessmentId
      - hidden
      - completed
    OverlayPatch:
      type: object
      properties:
        titleOverride:
          oneOf:
          - type: string
          - type: 'null'
        dateOverride:
          anyOf:
          - $ref: '#/components/schemas/DateValue'
          - type: 'null'
        overrideBase:
          anyOf:
          - $ref: '#/components/schemas/DateValue'
          - type: 'null'
        hidden:
          type: boolean
        completed:
          type: boolean
      description: Omitted fields are unchanged. Explicit null clears an optional
        override; dateOverride null also clears overrideBase. A nonnull baseline together
        with dateOverride null is contradictory and rejected without mutation. Nonnull
        dates capture the latest source baseline. Nulls are commands only and never
        persist in Snapshot. The HTTP adapter translates explicitly present JavaScript
        undefined override keys into null. This coordinated additive reset representation
        preserves the existing UI behavior (#53/#58).
    Material:
      type: object
      properties:
        id:
          type: string
        courseId:
          type: string
        section:
          type: string
        title:
          type: string
        fileType:
          type: string
          enum:
          - pdf
          - docx
          - pptx
          - link
          - video
          - other
        url:
          type: string
        accessible:
          type: boolean
        stale:
          type: boolean
        lastCheckedAt:
          type: string
        downloadedAt:
          type: string
        syllabusSuggestion:
          type: boolean
          default: false
      required:
      - id
      - courseId
      - section
      - title
      - fileType
      - url
      - accessible
      - stale
      - lastCheckedAt
      - syllabusSuggestion
    ImportedDocument:
      type: object
      properties:
        id:
          type: string
        courseId:
          type: string
        name:
          type: string
        format:
          type: string
          enum:
          - pdf
          - docx
        status:
          type: string
          enum:
          - queued
          - extracting
          - done
          - failed
          - needs_ocr
        progress:
          type: number
          minimum: 0
          maximum: 100
        error:
          type: string
        importedAt:
          type: string
        mocked:
          type: boolean
      required:
      - id
      - courseId
      - name
      - format
      - status
      - progress
      - importedAt
      - mocked
    ExtractionCandidate:
      type: object
      properties:
        id:
          type: string
        documentId:
          type: string
        courseId:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/AssessmentType'
        date:
          $ref: '#/components/schemas/DateValue'
        rawDateText:
          type: string
        language:
          type: string
          enum:
          - en
          - ru
        confidence:
          type: number
          minimum: 0
          maximum: 1
        excerpt:
          type: string
        location:
          type: string
        status:
          type: string
          enum:
          - pending
          - confirmed
          - corrected
          - rejected
          - auto
        matchAssessmentId:
          type: string
        reason:
          type: string
      required:
      - id
      - documentId
      - courseId
      - title
      - type
      - date
      - rawDateText
      - language
      - confidence
      - excerpt
      - location
      - status
    CourseSyncState:
      type: object
      properties:
        courseId:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - failed
          - never
          - syncing
        coverage:
          type: string
          enum:
          - full
          - partial
          - none
        lastSuccessAt:
          type: string
        error:
          type: string
        progress:
          type: number
          minimum: 0
          maximum: 100
      required:
      - courseId
      - status
      - coverage
      - progress
    DeadlineChange:
      type: object
      properties:
        id:
          type: string
        assessmentId:
          type: string
        from:
          $ref: '#/components/schemas/DateValue'
        to:
          $ref: '#/components/schemas/DateValue'
        detectedAt:
          type: string
      required:
      - id
      - assessmentId
      - from
      - to
      - detectedAt
    Alert:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - deadline
          - busy_week
          - change
          - sync
        message:
          type: string
        assessmentId:
          type: string
        deliveryKey:
          type: string
        createdAt:
          type: string
        read:
          type: boolean
      required:
      - id
      - kind
      - message
      - deliveryKey
      - createdAt
      - read
    Weights:
      type: object
      properties:
        exam:
          type: number
        assignment:
          type: number
        quiz:
          type: number
        other:
          type: number
      required:
      - exam
      - assignment
      - quiz
      - other
    Thresholds:
      type: object
      properties:
        maxOutstanding:
          type: number
        maxWeighted:
          type: number
      required:
      - maxOutstanding
      - maxWeighted
    ReminderSettings:
      type: object
      properties:
        enabled:
          type: boolean
        hoursBefore:
          type: number
        busyWeek:
          type: boolean
      required:
      - enabled
      - hoursBefore
      - busyWeek
    AiSettings:
      type: object
      properties:
        enabled:
          type: boolean
        consentGiven:
          type: boolean
      required:
      - enabled
      - consentGiven
    Settings:
      type: object
      properties:
        trackedCourseIds:
          type: array
          items:
            type: string
        semesterStart:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        semesterWeeks:
          type: integer
          minimum: 1
          maximum: 30
        timezone:
          type: string
        weights:
          $ref: '#/components/schemas/Weights'
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        reminders:
          $ref: '#/components/schemas/ReminderSettings'
        ai:
          $ref: '#/components/schemas/AiSettings'
      required:
      - trackedCourseIds
      - semesterStart
      - semesterWeeks
      - timezone
      - weights
      - thresholds
      - reminders
      - ai
    SettingsPatch:
      type: object
      properties:
        trackedCourseIds:
          type: array
          items:
            type: string
        semesterStart:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        semesterWeeks:
          type: integer
          minimum: 1
          maximum: 30
        timezone:
          type: string
        weights:
          $ref: '#/components/schemas/Weights'
        thresholds:
          $ref: '#/components/schemas/Thresholds'
        reminders:
          $ref: '#/components/schemas/ReminderSettings'
        ai:
          $ref: '#/components/schemas/AiSettings'
      description: Shallow Partial<Settings>. When a nested object is present, all
        of its members are required. updateSettings merges top-level fields, not nested
        fields.
    Snapshot:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/Overlay'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ImportedDocument'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionCandidate'
        sync:
          type: array
          items:
            $ref: '#/components/schemas/CourseSyncState'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DeadlineChange'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        settings:
          $ref: '#/components/schemas/Settings'
        collection:
          $ref: '#/components/schemas/SnapshotCollection'
      required:
      - courses
      - assessments
      - overlays
      - materials
      - documents
      - candidates
      - sync
      - changes
      - alerts
      - settings
    ConnectionInfo:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/ConnectionState'
        message:
          type: string
          description: Displayed verbatim to the student.
        extensionDetected:
          type: boolean
      required:
      - state
      - message
      - extensionDetected
    PersonalEventInput:
      type: object
      properties:
        courseId:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/AssessmentType'
        date:
          $ref: '#/components/schemas/DateValue'
      required:
      - courseId
      - title
      - type
      - date
    ReviewDecision:
      oneOf:
      - $ref: '#/components/schemas/ConfirmReview'
      - $ref: '#/components/schemas/RejectReview'
      - $ref: '#/components/schemas/CorrectReview'
      discriminator:
        propertyName: kind
        mapping:
          confirm: '#/components/schemas/ConfirmReview'
          reject: '#/components/schemas/RejectReview'
          correct: '#/components/schemas/CorrectReview'
    ConfirmReview:
      type: object
      properties:
        kind:
          type: string
          const: confirm
      required:
      - kind
    RejectReview:
      type: object
      properties:
        kind:
          type: string
          const: reject
      required:
      - kind
    CorrectReview:
      type: object
      properties:
        kind:
          type: string
          const: correct
        title:
          type: string
        date:
          $ref: '#/components/schemas/DateValue'
        type:
          $ref: '#/components/schemas/AssessmentType'
      required:
      - kind
      - title
      - date
      - type
    ImportDocumentInput:
      type: object
      properties:
        courseId:
          type: string
        fileName:
          type: string
          description: Only a file name is passed by the current frontend. File bytes,
            size, MIME type, and multipart upload are not part of its adapter contract.
      required:
      - courseId
      - fileName
    ImportResult:
      oneOf:
      - $ref: '#/components/schemas/ImportSuccess'
      - $ref: '#/components/schemas/ImportFailure'
    ImportSuccess:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
      - ok
    ImportFailure:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        reason:
          type: string
      required:
      - ok
      - reason
    ImportDocumentResponse:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        result:
          $ref: '#/components/schemas/ImportResult'
      required:
      - snapshot
      - result
    DownloadMaterialResponse:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        supported:
          type: boolean
        message:
          type: string
      required:
      - snapshot
      - supported
      - message
    AiAvailability:
      oneOf:
      - $ref: '#/components/schemas/AiUnavailable'
      - $ref: '#/components/schemas/AiAvailable'
    AiUnavailable:
      type: object
      properties:
        available:
          type: boolean
          const: false
        reason:
          type: string
      required:
      - available
      - reason
    AiAvailable:
      type: object
      properties:
        available:
          type: boolean
          const: true
        provider:
          type: string
        retention:
          type: string
      required:
      - available
      - provider
      - retention
    ProposedHttpError:
      type: object
      properties:
        message:
          type: string
          description: Proposed human-readable HTTP error message. There is no current
            frontend HTTP error-envelope parser.
      required:
      - message
    BridgeContext:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          const: '1'
        binding:
          type: string
          pattern: ^[0-9a-f]{32}$
      required:
      - version
      - binding
    CollectedDateObservation:
      type: object
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/DateValue'
        rawText: &id005
          type: string
        location: *id005
      required:
      - value
      - rawText
      - location
    AssignmentDates:
      type: object
      additionalProperties: false
      properties:
        opening:
          $ref: '#/components/schemas/CollectedDateObservation'
        due:
          $ref: '#/components/schemas/CollectedDateObservation'
        cutoff:
          $ref: '#/components/schemas/CollectedDateObservation'
    IndividualExtension:
