          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
      required:
      - idempotencyKey
      description: Resolve current selected courses and exact unique source mappings
        atomically. Replay returns the original selection; cross-kind key reuse or
        an active mock job conflicts. No caller-supplied URLs or namespace. Request
        size is limited to 1 MiB.
    ScanJob:
