          type: boolean
        claim:
          $ref: '#/components/schemas/ScanClaim'
      required:
      - unfinished
    ScanPageInput:
      type: object
      additionalProperties: false
      properties:
        pageType:
          type: string
          enum:
          - course
          - assignment
          - calendar
          - material
          - quiz
          - submission
          - unsupported
        scope:
          type: string
          enum:
          - visited_activity_only
          - supplied_pages_only
          - supplied_ranges_only
          - unknown
        outcome:
          type: string
          enum:
          - ok
          - partial
          - failed
          - unavailable
          - forbidden
          - signed_out
          - undiscovered
        coverage:
          type: string
          enum:
          - complete
          - partial
          - none
        reasons: &id042
          type: array
          items:
            type: string
            enum:
            - undiscovered
            - unsupported_page
            - collector_unavailable
            - access_error
            - signed_out
            - forbidden
            - request_failed
            - limit_reached
            - invalid_context
          maxItems: 9
          uniqueItems: true
        observedAt:
          type: string
          format: date-time
        pageUrl:
          type: string
          minLength: 1
          maxLength: 4096
          format: uri
          description: Canonical whitelisted HTTPS SDU route, with only its allowed
            query keys; no credentials, fragments, traversal or noncanonical port.
        collector:
          type: string
          enum:
          - assignment
          - calendar
          - material
          - quiz
          - submission
        result:
          oneOf:
          - $ref: '#/components/schemas/AssignmentRefreshResult'
          - $ref: '#/components/schemas/CalendarRefreshResult'
          - $ref: '#/components/schemas/MaterialRefreshResult'
          - $ref: '#/components/schemas/QuizRefreshResult'
          - $ref: '#/components/schemas/SubmissionRefreshResult'
      required:
      - pageType
      - scope
      - outcome
      - coverage
      - reasons
      description: Collector/result kind must match; assignment uses /mod/assign/view.php,
        calendar uses /calendar/view.php, material uses a supported course, resource,
        url or folder route, quiz uses /mod/quiz/view.php and submission uses /mod/assign/view.php.
        Page type, collector, scope, route, source identity and claimed course must
        agree under server domain validation. A checked page requires a valid observation
        time; undiscovered sections must omit it. Failed, unavailable, forbidden,
        signed-out, unsupported and undiscovered evidence carries the applicable fixed
        reason; accepted observations require ok or partial outcome. An empty or incomplete
        listing cannot establish complete coverage.
      allOf:
      - &id031
        if:
          properties:
            outcome:
              const: undiscovered
          required:
          - outcome
        then:
          not:
            required:
            - observedAt
        else:
          required:
          - observedAt
      - if:
          required:
          - collector
        then:
          required:
          - result
      - if:
          required:
          - result
        then:
          required:
          - collector
          properties:
            outcome:
              type: string
              enum:
              - ok
              - partial
      - &id032
        if:
          properties:
            outcome:
              type: string
              enum:
              - failed
              - unavailable
              - forbidden
              - signed_out
              - undiscovered
          required:
          - outcome
        then:
          properties:
            coverage:
              type: string
              enum:
              - partial
              - none
            reasons:
              minItems: 1
          not:
            required:
            - result
      - &id033
        if:
          properties:
            pageType:
              const: unsupported
          required:
          - pageType
        then:
          properties:
            coverage:
              type: string
              enum:
              - partial
              - none
            reasons:
              contains:
                const: unsupported_page
      - &id034
        if:
          properties:
            outcome:
              const: failed
          required:
          - outcome
        then:
          properties:
            reasons:
              contains:
                type: string
                enum:
                - access_error
                - request_failed
                - invalid_context
      - &id035
        if:
          properties:
            outcome:
              const: partial
          required:
          - outcome
        then:
          properties:
            coverage:
              type: string
              enum:
              - partial
              - none
            reasons:
              minItems: 1
      - if:
          properties:
            coverage:
              const: complete
          required:
          - coverage
        then:
          required:
          - collector
          - result
          - pageUrl
      - if:
          properties:
            collector:
              const: assignment
          required:
          - collector
        then:
          properties:
            result:
              $ref: '#/components/schemas/AssignmentRefreshResult'
          required:
          - pageUrl
      - if:
          properties:
            collector:
              const: calendar
          required:
          - collector
        then:
          properties:
            result:
              $ref: '#/components/schemas/CalendarRefreshResult'
          required:
          - pageUrl
      - if:
          properties:
            collector:
              const: material
          required:
          - collector
        then:
          properties:
            result:
              $ref: '#/components/schemas/MaterialRefreshResult'
          required:
          - pageUrl
      - if:
          properties:
            collector:
              const: quiz
          required:
          - collector
        then:
          properties:
            result:
              $ref: '#/components/schemas/QuizRefreshResult'
          required:
          - pageUrl
      - if:
          properties:
            collector:
              const: submission
          required:
          - collector
        then:
          properties:
            result:
              $ref: '#/components/schemas/SubmissionRefreshResult'
          required:
          - pageUrl
      - &id036
        if:
          properties:
            outcome:
              const: unavailable
          required:
          - outcome
        then:
          properties:
            reasons:
              contains:
                const: collector_unavailable
      - &id037
        if:
          properties:
            outcome:
              const: forbidden
          required:
          - outcome
        then:
          properties:
            reasons:
              contains:
                const: forbidden
      - &id038
        if:
          properties:
            outcome:
              const: signed_out
          required:
          - outcome
        then:
          properties:
            reasons:
              contains:
                const: signed_out
      - &id039
        if:
          properties:
            outcome:
              const: undiscovered
          required:
          - outcome
        then:
          properties:
            reasons:
              contains:
                const: undiscovered
