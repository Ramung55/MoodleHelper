components:
  schemas:
    MaterialDownloadStart:
      properties:
        datasetId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          title: Datasetid
        materialId:
          type: string
          maxLength: 256
          minLength: 1
          title: Materialid
        idempotencyKey:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          title: Idempotencykey
      type: object
      required:
      - datasetId
      - materialId
      - idempotencyKey
      title: MaterialDownloadStart
    MaterialTransfer:
      properties:
        transferId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          title: Transferid
        generation:
          type: integer
          minimum: 0.0
          title: Generation
        materialId:
          type: string
          maxLength: 256
          minLength: 1
          title: Materialid
        state:
          type: string
          enum:
          - queued
          - validating
          - saving
          - complete
          - failed
          - cancelled
          - interrupted
          title: State
        reason:
          type: string
          enum:
          - sign_in_required
          - forbidden
          - not_found
          - network
          - unsupported_type
          - too_large
          - timeout
          - cancelled_by_user
          - page_closed
          - download_interrupted
          - outcome_unknown
          title: Reason
        downloadId:
          type: integer
          minimum: 0.0
          title: Downloadid
        bytesReceived:
          type: integer
          minimum: 0.0
          title: Bytesreceived
        totalBytes:
          type: integer
          minimum: 0.0
          title: Totalbytes
        cancelRequested:
          type: boolean
          title: Cancelrequested
        createdAt:
          type: string
          title: Createdat
        updatedAt:
          type: string
          title: Updatedat
        completedAt:
          type: string
          title: Completedat
      type: object
      required:
      - transferId
      - generation
      - materialId
      - state
      - cancelRequested
      - createdAt
      - updatedAt
      title: MaterialTransfer
    MaterialDownloadStartResult:
      properties:
        supported:
          type: boolean
          title: Supported
        message:
          type: string
          title: Message
        reason:
          type: string
          enum:
          - material_not_found
          - not_a_file
          - unsupported_type
          - unsafe_destination
          - source_unavailable
          title: Reason
        transfer:
          $ref: '#/components/schemas/MaterialTransfer'
      type: object
      required:
      - supported
      - message
      title: MaterialDownloadStartResult
    MaterialDownloadList:
      properties:
        transfers:
          items:
            $ref: '#/components/schemas/MaterialTransfer'
          type: array
          maxItems: 1000
          title: Transfers
      type: object
      required:
      - transfers
      title: MaterialDownloadList
    MaterialTransferDescriptor:
      properties:
        transferId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          title: Transferid
        generation:
          type: integer
          minimum: 0.0
          title: Generation
        attemptId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          title: Attemptid
        materialId:
          type: string
          maxLength: 256
          minLength: 1
          title: Materialid
        url:
          type: string
          title: Url
        format:
          type: string
          const: pdf
          title: Format
        suggestedName:
          type: string
          maxLength: 200
          title: Suggestedname
        maxBytes:
          type: integer
          minimum: 1.0
          title: Maxbytes
        timeoutMs:
          type: integer
          minimum: 1.0
          title: Timeoutms
      type: object
      required:
      - transferId
      - generation
      - attemptId
      - materialId
      - url
      - format
      - maxBytes
      - timeoutMs
      title: MaterialTransferDescriptor
    MaterialTransferStatus:
      properties:
        generation:
          type: integer
          minimum: 0.0
          title: Generation
        attemptId:
          type: string
          pattern: ^[A-Za-z0-9-]{1,128}$
          title: Attemptid
        state:
          type: string
          enum:
          - queued
          - validating
          - saving
          - complete
          - failed
          - cancelled
          - interrupted
          title: State
        reason:
          type: string
          enum:
          - sign_in_required
          - forbidden
          - not_found
          - network
          - unsupported_type
          - too_large
          - timeout
          - cancelled_by_user
          - page_closed
          - download_interrupted
          - outcome_unknown
          title: Reason
        downloadId:
          type: integer
          minimum: 0.0
          title: Downloadid
        bytesReceived:
          type: integer
          maximum: 20971520.0
          minimum: 0.0
          title: Bytesreceived
        totalBytes:
          type: integer
          minimum: 0.0
          title: Totalbytes
      type: object
      required:
      - generation
      - attemptId
      - state
      title: MaterialTransferStatus
    ReminderDeliveryRequest:
      properties:
        requestId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Requestid
        kind:
          type: string
          enum:
          - deadline
          - busy_week
          - catch_up
          title: Kind
        state:
          type: string
          const: requested
          title: State
        total:
          type: integer
          minimum: 1.0
          title: Total
        targets:
          items:
            $ref: '#/components/schemas/ReminderDeliveryTarget'
          type: array
          maxItems: 100
          title: Targets
      type: object
      required:
      - requestId
      - kind
      - state
      - total
      - targets
      title: ReminderDeliveryRequest
    ReminderDeliveryTarget:
      properties:
        itemId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Itemid
        deliveryKey:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Deliverykey
        kind:
          type: string
          enum:
          - deadline
          - busy_week
          title: Kind
        assessmentId:
          type: string
          maxLength: 512
          title: Assessmentid
        week:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Week
        dueAt:
          type: string
          title: Dueat
      type: object
      required:
      - itemId
      - deliveryKey
      - kind
      - dueAt
      title: ReminderDeliveryTarget
    RestoreContext:
      properties:
        datasetId:
          type: string
        epoch:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
      additionalProperties: false
      type: object
      required:
      - datasetId
      - epoch
      - revision
    BackupRestoreInput:
      properties:
        idempotencyKey:
          type: string
          maxLength: 128
          minLength: 8
          pattern: ^[A-Za-z0-9._~-]+$
        expectedDatasetId:
          type: string
          maxLength: 64
          minLength: 1
        expectedEpoch:
          type: integer
          minimum: 0
        expectedRevision:
          type: integer
          minimum: 0
        backup:
          additionalProperties: true
          type: object
      additionalProperties: false
      type: object
      required:
      - idempotencyKey
      - expectedDatasetId
      - expectedEpoch
      - expectedRevision
      - backup
    BackupRestoreResult:
      properties:
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        datasetId:
          type: string
        epoch:
          type: integer
          minimum: 0
        revision:
          type: integer
          minimum: 0
        restoreId:
          type: string
        remindersRebuilt:
          type: boolean
        reminderGeneration:
          type: string
        replayed:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - snapshot
      - datasetId
      - epoch
      - revision
      - restoreId
      - remindersRebuilt
      - reminderGeneration
      - replayed
    ReminderDispatchInput:
      properties:
        datasetId:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Datasetid
        expectedGeneration:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Expectedgeneration
        idempotencyKey:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Idempotencykey
      additionalProperties: false
      type: object
      required:
      - datasetId
      - expectedGeneration
      - idempotencyKey
      title: ReminderDispatchInput
    ReminderDispatchResult:
      properties:
        datasetId:
          type: string
          maxLength: 128
          title: Datasetid
        generation:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Generation
        serverTime:
          type: string
          title: Servertime
        replayed:
          type: boolean
          title: Replayed
        requests:
          items:
            $ref: '#/components/schemas/ReminderDeliveryRequest'
          type: array
          maxItems: 100
          title: Requests
        nextWakeAt:
          type: string
          title: Nextwakeat
        pendingDeliveries:
          items:
            $ref: '#/components/schemas/ReminderPendingDelivery'
          type: array
          maxItems: 20
          title: Pendingdeliveries
      type: object
      required:
      - datasetId
      - generation
      - serverTime
      - replayed
      - requests
      title: ReminderDispatchResult
    ReminderPlan:
      properties:
        datasetId:
          type: string
          maxLength: 128
          title: Datasetid
        generation:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Generation
        serverTime:
          type: string
          title: Servertime
        enabled:
          type: boolean
          title: Enabled
        reasons:
          items:
            type: string
            enum:
            - disabled
            - invalid_lead_time
            - timezone_data_unavailable
            - calendar_missing
            - calendar_invalid
            - date_unknown
            - week_outside_calendar
            - date_outside_calendar
            - local_time_ambiguous
            - invalid_weights
          type: array
          maxItems: 20
          title: Reasons
        items:
          items:
            $ref: '#/components/schemas/ReminderPlanItem'
          type: array
          maxItems: 100
          title: Items
        nextCursor:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._~-]+$
          title: Nextcursor
        nextWakeAt:
          type: string
          title: Nextwakeat
        pendingDeliveries:
          items:
            $ref: '#/components/schemas/ReminderPendingDelivery'
          type: array
          maxItems: 20
          title: Pendingdeliveries
      type: object
      required:
      - datasetId
      - generation
      - serverTime
      - enabled
      - reasons
      - items
      title: ReminderPlan
    ReminderPlanItem:
      properties:
        id:
          type: string
