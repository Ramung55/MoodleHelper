components:
  schemas:
    QueueCurrent:
      type: object
      additionalProperties: false
      properties:
        courseIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 8192, pattern: '\S'}
        run:
          $ref: '#/components/schemas/QueueRun'
        lastFailedRun:
          $ref: '#/components/schemas/QueueRun'
      required: [courseIds]
    QueueStart:
      description: Start a run for 1-100 distinct existing course IDs in the trusted
        startup namespace. IDs are sorted for idempotency comparison. Reusing a key
        with a different set returns 409; unknown IDs return 422 without side effects.
        Queue requests have a 1 MiB body limit.
      type: object
      additionalProperties: false
      properties:
        idempotencyKey: &id012
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
        courseIds:
          type: array
          items: &id014
            type: string
            minLength: 1
            maxLength: 8192
            pattern: \S
          minItems: 1
          maxItems: 100
          uniqueItems: true
      required:
      - idempotencyKey
      - courseIds
    QueueClaimInput:
      type: object
      additionalProperties: false
      properties: {}
    QueueClaimToken:
      type: object
      additionalProperties: false
      properties:
        jobId: *id012
        generation:
          type: integer
          minimum: 1
        token: *id012
      required:
      - jobId
      - generation
      - token
    QueueFinish:
      description: Finish a current, unexpired claim. A failed outcome requires errorCode
        mock_failure; a completed outcome must omit errorCode. Stale or fenced claims
        return 409. Result insertion and completion commit atomically.
      type: object
      additionalProperties: false
      properties:
        jobId: *id012
        generation:
          type: integer
          minimum: 1
        token: *id012
        outcome:
          type: string
          enum:
          - completed
          - failed
        errorCode:
          type: string
          const: mock_failure
      required:
      - jobId
      - generation
      - token
      - outcome
    QueueProgress:
      type: object
      additionalProperties: false
      properties:
        pending: &id013
          type: integer
          minimum: 0
        running: *id013
        completed: *id013
        failed: *id013
        cancelled: *id013
        total: *id013
      required:
      - pending
      - running
      - completed
      - failed
      - cancelled
      - total
    QueueResult:
      type: object
      additionalProperties: false
      properties:
        id: *id012
        summary:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - id
      - summary
    QueueJob:
      type: object
      additionalProperties: false
      properties:
        id: *id012
        courseId: *id014
        state: &id015
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
        attempts: *id013
        generation: *id013
        errorCode:
          type: string
          const: mock_failure
        result:
          $ref: '#/components/schemas/QueueResult'
      required:
      - id
      - courseId
      - state
      - attempts
      - generation
    QueueRun:
      type: object
      additionalProperties: false
      properties:
        id: *id012
        idempotencyKey: *id012
        courseIds:
          type: array
          items: *id014
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdAt: *id013
        status: *id015
        cancelled:
          type: boolean
        progress:
          $ref: '#/components/schemas/QueueProgress'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/QueueJob'
          maxItems: 100
        nextCursor: *id012
      required:
      - id
      - idempotencyKey
      - courseIds
      - createdAt
      - status
      - cancelled
      - progress
      - jobs
    QueueClaim:
      description: Claims expire after 60 seconds and may be renewed before expiry.
        A worker should renew every 20 seconds. Execution may repeat after interruption;
        completed results are committed once per job.
      type: object
      additionalProperties: false
      properties:
        job:
          $ref: '#/components/schemas/QueueJob'
        token: *id012
        generation:
          type: integer
          minimum: 1
        expiresAt: *id013
      required:
      - job
      - token
      - generation
      - expiresAt
    QueueClaimResponse:
      type: object
      additionalProperties: false
      properties:
        claim:
          $ref: '#/components/schemas/QueueClaim'
        unfinished:
          type: boolean
      required:
      - unfinished
    QueueRenewResponse:
      type: object
      additionalProperties: false
      properties:
        expiresAt: *id013
      required:
      - expiresAt
    DateValue:
      oneOf:
      - $ref: '#/components/schemas/ExactDate'
      - $ref: '#/components/schemas/CalendarDate'
      - $ref: '#/components/schemas/TeachingWeek'
      - $ref: '#/components/schemas/UnknownDate'
      discriminator:
        propertyName: kind
        mapping:
          exact: '#/components/schemas/ExactDate'
          date: '#/components/schemas/CalendarDate'
          week: '#/components/schemas/TeachingWeek'
          unknown: '#/components/schemas/UnknownDate'
      description: The four frontend date forms. Do not replace date-only, teaching-week,
        or unknown values with invented exact timestamps.
    ExactDate:
      type: object
      properties:
        kind:
          const: exact
          type: string
        iso:
          type: string
          description: Exact-time string. The frontend schema accepts any string;
            this contract does not add date-time validation.
        tz:
          type: string
          description: Timezone string; not constrained to a particular registry by
            the frontend schema.
      required:
      - kind
      - iso
      - tz
    CalendarDate:
      type: object
      properties:
        kind:
          const: date
          type: string
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
      - kind
      - date
    TeachingWeek:
      type: object
      properties:
        kind:
          const: week
          type: string
        week:
          type: integer
          minimum: 1
          maximum: 30
      required:
      - kind
      - week
    UnknownDate:
      type: object
      properties:
        kind:
          const: unknown
          type: string
        note:
          type: string
      required:
      - kind
    AssessmentType:
      type: string
      enum:
      - assignment
      - quiz
      - exam
      - other
    SubmissionStatus:
      type: string
      enum:
      - submitted
      - draft
      - not_submitted
      - reopened
      - unknown
    ConnectionState:
      type: string
      enum:
      - demo
      - connected
      - disconnected
      - error
    KnownString:
      type: object
      properties:
        kind:
          type: string
          const: known
        value: &id016
          type: string
      required:
      - kind
      - value
    KnownStrings:
      type: object
      properties:
        kind:
          type: string
          const: known
        value:
          type: array
          items: *id016
      required:
      - kind
      - value
    UnknownFact:
      type: object
      properties:
        kind:
          type: string
          const: unknown
      required:
      - kind
    RawCourseObservation:
      type: object
      properties:
        sourceCourseId: *id016
        sourceUrl: *id016
        title: &id017
          oneOf:
          - $ref: '#/components/schemas/KnownString'
          - $ref: '#/components/schemas/UnknownFact'
          discriminator:
            propertyName: kind
        termIndicators: &id018
          oneOf:
