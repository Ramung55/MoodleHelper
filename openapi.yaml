# Source-derived proposed HTTP contract; no HTTP client is implemented yet.
openapi: "3.1.0"
info:
  title: "Moodle Helper - proposed backend contract"
  version: "0.1.0"
  description: |-
    PROPOSED HTTP MAPPING, NOT AN EXISTING API. The frontend has no HTTP API client: frontend/src/services/index.ts always returns DemoAdapter, which stores data in localStorage. frontend/src/services/extension-adapter.ts implements only an origin-checked window.postMessage ping/hello handshake, not HTTP transport or a data-capable ExtensionAdapter.

    This document maps every method in MoodleHelperAdapter to a proposed method/path. Paths, HTTP verbs, 200 success status codes, and the generic error envelope are design choices for a future HTTP adapter. No frontend request is currently sent to these URLs. Implementing a backend alone will not connect the frontend; a matching HTTP adapter is still required.

    Authentication: no adapter request carries credentials, an Authorization header, or a session cookie. Every operation therefore has security: []. This describes the current credential-free local/demo boundary, not permission to expose student data publicly. Authentication, authorization, user isolation, trusted-origin policy, and deployment must be designed before any internet-facing backend; no login flow or auth scheme is invented.

    All successful return values follow the TypeScript adapter contract. Data operations return the complete Snapshot, not a partial entity, unless the adapter explicitly declares a wrapper. Readonly adapter.kind ('demo' | 'extension') is metadata, not an endpoint. File export/backup preview, derived workload, filtering, and eligible-alert calculations are frontend-local and have no backend endpoint.

    syncAll and importDocument accept in-process progress callbacks. This proposed HTTP mapping returns only the final result; it cannot carry a JavaScript callback. Progress transport and any cancellation contract remain unspecified. No invented SSE, polling, websocket, or job endpoint is claimed.

    Schemas mirror frontend/src/domain/types.ts and frontend/src/services/adapter.ts. String timestamps, timezones, and URLs are intentionally not given stricter formats than the source schemas. Defaulted booleans are present in the inferred Snapshot output; parsing a restore may materialize the source Zod defaults. Unknown object fields are not made invalid here because the source Zod objects strip extras where parsed rather than universally rejecting them.

    Current adapter failures are rejected JavaScript promises and inline ImportResult/download capability responses, not HTTP errors. The shared default response below is a proposed HTTP convention only; no 401/403 or not-found behavior is inferred.
x-contract-status: "proposed-http-projection-of-local-adapter"
x-source-files:
  - "frontend/src/services/adapter.ts"
  - "frontend/src/services/index.ts"
  - "frontend/src/services/demo-adapter.ts"
  - "frontend/src/services/extension-adapter.ts"
  - "frontend/src/domain/types.ts"
  - "frontend/src/domain/backup.ts"
  - "frontend/src/domain/extraction.ts"
  - "frontend/src/lib/app-store.tsx"
  - "frontend/src/routes/settings.tsx"
  - "frontend/src/routes/syllabus.tsx"
servers:
  -
    url: "/"
    description: "Placeholder relative origin for a future same-origin HTTP adapter; no backend host or API base is configured by the frontend."
security: []
tags:
  -
    name: "Connection"
  -
    name: "Snapshot"
  -
    name: "Courses"
  -
    name: "Assessments"
  -
    name: "Sync"
  -
    name: "Documents"
  -
    name: "Materials"
  -
    name: "Alerts"
  -
    name: "Settings"
  -
    name: "Local data"
  -
    name: "Demo"
  -
    name: "AI availability"
paths:
  "/api/connection":
    get:
      operationId: "connection"
      tags:
        - "Connection"
      summary: "Get adapter connection information"
      description: "No request body. Returns connection state, student-facing message, and extension detection flag. Current demo state remains 'demo' even if the UI independently detects an extension; detection alone does not enable live collection."
      security: []
      x-frontend-method: "MoodleHelperAdapter.connection"
      x-http-mapping: "proposed"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ConnectionInfo"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/snapshot":
    get:
      operationId: "load"
      tags:
        - "Snapshot"
      summary: "Load the complete dataset"
      description: "No request body. Returns the complete Snapshot consumed by AppProvider. The current implementation loads local demo fixtures or saved localStorage data."
      security: []
      x-frontend-method: "MoodleHelperAdapter.load"
      x-http-mapping: "proposed"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
    put:
      operationId: "replaceAll"
      tags:
        - "Snapshot"
      summary: "Atomically replace the dataset after restore validation"
      description: "Request body is a bare Snapshot, not the Backup {app,version,exportedAt,note,data} wrapper. Backup generation, file parsing, version checks, preview, and confirmation are client-local; settings.tsx passes preview.backup.data. DemoAdapter validates Snapshot with Zod before writing and rejects invalid input before mutation."
      security: []
      x-frontend-method: "MoodleHelperAdapter.replaceAll"
      x-http-mapping: "proposed"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Snapshot"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  /api/courses/discovery:
    post:
      operationId: ingestCourseDiscovery
      tags:
      - Courses
      summary: Atomically merge observed course facts
      description: Validate normalized nonblank known strings and nonempty known arrays,
        canonical positive decimal STRING IDs, exact canonical https://moodle.sdu.edu.kz/course/view.php?id=<sourceCourseId>
        URL at this ingestion boundary only. One latest-Snapshot store.mutate; trusted
        store namespace; no caller identity/tracking/current flag. Retain missing courses
        and all personal choices. New courses untracked with current=false, currentTermStatus=unknown.
        Reject ambiguous source mappings and deterministic identity collisions atomically.
        No coverage claim.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseDiscoveryInput'
      responses:
        '200':
          description: Confirmed Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '422': &id001
          $ref: '#/components/responses/ProposedHttpFailure'
        '503': *id001
        default: *id001
  "/api/tracked-courses":
    put:
      operationId: "setTrackedCourses"
      tags:
        - "Courses"
      summary: "Replace tracked course identifiers"
      description: "Request body is a bare string array, not an object wrapper. Empty selection is allowed by the adapter. Returns the updated complete Snapshot."
      security: []
      x-frontend-method: "MoodleHelperAdapter.setTrackedCourses"
      x-http-mapping: "proposed"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "array"
              items:
                type: "string"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/assessments/{assessmentId}/overlay":
    patch:
      operationId: "updateOverlay"
      tags:
        - "Assessments"
      summary: "Update personal assessment overlay"
      description: "Patches the personal layer without mutating source evidence. Omitted properties remain unchanged. Explicit null clears titleOverride, dateOverride or overrideBase; clearing dateOverride also clears its baseline. Setting a nonnull dateOverride captures the latest effective source date. Clearing dateOverride while supplying a nonnull overrideBase is rejected atomically. Snapshot overlays never contain nulls."
      security: []
      x-frontend-method: "MoodleHelperAdapter.updateOverlay"
      x-http-mapping: "proposed"
      parameters:
        -
          name: "assessmentId"
          in: "path"
          required: true
          description: "Assessment identifier passed as the first adapter argument."
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OverlayPatch"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/personal-events":
    post:
      operationId: "addPersonalEvent"
      tags:
        - "Assessments"
      summary: "Add a personal assessment"
      description: "Creates personal source evidence and returns the full updated Snapshot. The source contract requires courseId, title, type, and DateValue but does not impose a nonempty title or referential-integrity schema rule."
      security: []
      x-frontend-method: "MoodleHelperAdapter.addPersonalEvent"
      x-http-mapping: "proposed"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PersonalEventInput"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/personal-events/{id}":
    delete:
      operationId: "deletePersonalEvent"
      tags:
        - "Assessments"
      summary: "Delete a personal assessment"
      description: "No request body. The current demo removes a matching assessment only if personal is true and removes the overlay with this id; missing ids are a no-op rather than a declared 404. Return the full updated Snapshot, not 204."
      security: []
      x-frontend-method: "MoodleHelperAdapter.deletePersonalEvent"
      x-http-mapping: "proposed"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          description: "Personal assessment identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/sync":
    post:
      operationId: "syncAll"
      tags:
        - "Sync"
      summary: "Run sync and return its final snapshot"
      description: "No request body. In-process onProgress receives intermediate Snapshots; this proposed HTTP operation returns only the final Snapshot. A future HTTP adapter needs a separately agreed progress transport to preserve incremental UI updates. Course-level failures are recorded in Snapshot.sync and can coexist with a successful operation response. Current demo never contacts Moodle and simulates one failing course."
      security: []
      x-frontend-method: "MoodleHelperAdapter.syncAll"
      x-http-mapping: "proposed"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/documents/import":
    post:
      operationId: "importDocument"
      tags:
        - "Documents"
      summary: "Import a syllabus by its supplied filename"
      description: "Filename-only JSON matching the current adapter, not a multipart file upload. The UI supplies File.name and never reads or passes file bytes. Current demo only checks the extension (PDF/DOCX), simulates extraction, and adds a mocked candidate. Unsupported formats return 200 with result.ok=false and reason, not a fabricated HTTP validation error. onProgress callbacks are not transmitted; the response contains the final snapshot and result."
      security: []
      x-frontend-method: "MoodleHelperAdapter.importDocument"
      x-http-mapping: "proposed"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ImportDocumentInput"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ImportDocumentResponse"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/candidates/{candidateId}/review":
    post:
      operationId: "review"
      tags:
        - "Documents"
      summary: "Confirm, reject, or correct an extraction candidate"
      description: "Request is the ReviewDecision discriminated union. Corrections require title, date, and assessment type. Current demo treats an unknown candidate as a no-op returning the current Snapshot and can attach evidence to matchAssessmentId. The method currently has no idempotency guard; repeated confirm can append evidence or assessments, so no idempotency guarantee is invented."
      security: []
      x-frontend-method: "MoodleHelperAdapter.review"
      x-http-mapping: "proposed"
      parameters:
        -
          name: "candidateId"
          in: "path"
          required: true
          description: "Extraction candidate identifier."
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/materials/{id}/download":
    post:
      operationId: "downloadMaterial"
      tags:
        - "Materials"
      summary: "Request a material download capability outcome"
      description: "No request body. Return a JSON capability/result wrapper, not file bytes or a redirect. Current demo always returns supported=false, with a message distinguishing inaccessible resources from extension-required downloads; a missing resource follows the inaccessible result."
      security: []
      x-frontend-method: "MoodleHelperAdapter.downloadMaterial"
      x-http-mapping: "proposed"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          description: "Material identifier."
          schema:
            type: "string"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DownloadMaterialResponse"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/alerts":
    put:
      operationId: "saveAlerts"
      tags:
        - "Alerts"
      summary: "Replace the persisted alert collection"
      description: "Request is a bare array of Alert records. It replaces the collection rather than appending one alert and returns the complete Snapshot. Eligibility calculations run in the frontend and are not another API operation."
      security: []
      x-frontend-method: "MoodleHelperAdapter.saveAlerts"
      x-http-mapping: "proposed"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "array"
              items:
                "$ref": "#/components/schemas/Alert"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/settings":
    patch:
      operationId: "updateSettings"
      tags:
        - "Settings"
      summary: "Shallow-update settings"
      description: "Top-level settings fields are optional. Nested weights, thresholds, reminders, or AI objects, when supplied, must be complete because the source type is shallow Partial<Settings> and the current implementation shallow-merges. No extra positivity constraints are added to numbers that the source schema leaves unconstrained."
      security: []
      x-frontend-method: "MoodleHelperAdapter.updateSettings"
      x-http-mapping: "proposed"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/local-data":
    delete:
      operationId: "deleteLocalData"
      tags:
        - "Local data"
      summary: "Clear the local dataset"
      description: "No request body. Return the post-deletion Snapshot. Current demo clears all record arrays and trackedCourseIds but retains the other settings; it does not delete Moodle records or disk files. No claim is made that the current demo implements background worker/alarm cleanup."
      security: []
      x-frontend-method: "MoodleHelperAdapter.deleteLocalData"
      x-http-mapping: "proposed"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
  "/api/demo/reset":
    post:
      operationId: "resetDemo"
      tags:
        - "Demo"
      summary: "Reset fictional demo data (optional capability)"
      description: "No request body. This adapter method is optional and UI is shown only when it exists. It returns a fresh fictional demo Snapshot; it must not be assumed available on a production adapter. An HTTP implementation must agree how it advertises optional-method support before switching the current frontend; no capability-discovery endpoint is invented."
      security: []
      x-frontend-method: "MoodleHelperAdapter.resetDemo"
      x-http-mapping: "proposed"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
      x-optional-adapter-method: true
      x-demo-only: true
  "/api/ai/availability":
    get:
      operationId: "aiAvailability"
      tags:
        - "AI availability"
      summary: "Get AI availability and policy information"
      description: "No request body. An unavailable result requires reason; an available result requires provider and retention. Current demo always returns unavailable. There is no AI invocation/upload operation in this frontend, and settings.ai.enabled/consentGiven alone never send content."
      security: []
      x-frontend-method: "MoodleHelperAdapter.aiAvailability"
      x-http-mapping: "proposed"
      responses:
        "200":
          description: "Final adapter return value (proposed HTTP success status)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AiAvailability"
        default:
          "$ref": "#/components/responses/ProposedHttpFailure"
components:
  schemas:
    DateValue:
      oneOf:
        -
          "$ref": "#/components/schemas/ExactDate"
        -
          "$ref": "#/components/schemas/CalendarDate"
        -
          "$ref": "#/components/schemas/TeachingWeek"
        -
          "$ref": "#/components/schemas/UnknownDate"
      discriminator:
        propertyName: "kind"
        mapping:
          exact: "#/components/schemas/ExactDate"
          date: "#/components/schemas/CalendarDate"
          week: "#/components/schemas/TeachingWeek"
          unknown: "#/components/schemas/UnknownDate"
      description: "The four frontend date forms. Do not replace date-only, teaching-week, or unknown values with invented exact timestamps."
    ExactDate:
      type: "object"
      properties:
        kind:
          const: "exact"
          type: "string"
        iso:
          type: "string"
          description: "Exact-time string. The frontend schema accepts any string; this contract does not add date-time validation."
        tz:
          type: "string"
          description: "Timezone string; not constrained to a particular registry by the frontend schema."
      required:
        - "kind"
        - "iso"
        - "tz"
    CalendarDate:
      type: "object"
      properties:
        kind:
          const: "date"
          type: "string"
        date:
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      required:
        - "kind"
        - "date"
    TeachingWeek:
      type: "object"
      properties:
        kind:
          const: "week"
          type: "string"
        week:
          type: "integer"
          minimum: 1
          maximum: 30
      required:
        - "kind"
        - "week"
    UnknownDate:
      type: "object"
      properties:
        kind:
          const: "unknown"
          type: "string"
        note:
          type: "string"
      required:
        - "kind"
    AssessmentType:
      type: "string"
      enum:
        - "assignment"
        - "quiz"
        - "exam"
        - "other"
    SubmissionStatus:
      type: "string"
      enum:
        - "submitted"
        - "draft"
        - "not_submitted"
        - "reopened"
        - "unknown"
    ConnectionState:
      type: "string"
      enum:
        - "demo"
        - "connected"
        - "disconnected"
        - "error"
    KnownString:
      type: object
      properties:
        kind:
          type: string
          const: known
        value: &model001
          type: string
      required:
      - kind
      - value
    KnownStrings:
      type: object
      properties:
        kind:
          type: string
          const: known
        value:
          type: array
          items: *model001
      required:
      - kind
      - value
    UnknownFact:
      type: object
      properties:
        kind:
          type: string
          const: unknown
      required:
      - kind
    RawCourseObservation:
      type: object
      properties:
        sourceCourseId: *model001
        sourceUrl: *model001
        title: &model002
          oneOf:
          - $ref: '#/components/schemas/KnownString'
          - $ref: '#/components/schemas/UnknownFact'
          discriminator:
            propertyName: kind
        termIndicators: &model003
          oneOf:
          - $ref: '#/components/schemas/KnownStrings'
          - $ref: '#/components/schemas/UnknownFact'
          discriminator:
            propertyName: kind
      required:
      - sourceCourseId
      - sourceUrl
      - title
      - termIndicators
    CourseDiscovery:
      type: object
      properties:
        sourceCourseId: *model001
        sourceUrl: *model001
        title: *model002
        termIndicators: *model003
        currentTermStatus:
          type: string
          enum:
          - current
          - past
          - unknown
      required:
      - sourceCourseId
      - sourceUrl
      - title
      - termIndicators
      - currentTermStatus
    CourseDiscoveryInput:
      type: object
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/RawCourseObservation'
      required:
      - observations
    Course:
      type: "object"
      properties:
        id:
          type: "string"
        code:
          type: "string"
        name:
          type: "string"
        color:
          type: "integer"
          minimum: 1
          maximum: 6
        discovery:
          "$ref": "#/components/schemas/CourseDiscovery"
        current:
          type: "boolean"
      required:
        - "id"
        - "code"
        - "name"
        - "color"
        - "current"
    SourceEvidence:
      type: "object"
      properties:
        source:
          type: "string"
          enum:
            - "moodle"
            - "syllabus"
            - "personal"
        date:
          "$ref": "#/components/schemas/DateValue"
        excerpt:
          type: "string"
        location:
          type: "string"
        url:
          type: "string"
        observedAt:
          type: "string"
      required:
        - "source"
        - "date"
        - "observedAt"
    SubmissionObservation:
      type: "object"
      properties:
        status:
          "$ref": "#/components/schemas/SubmissionStatus"
        evidence:
          type: "string"
        observedAt:
          type: "string"
      required:
        - "status"
        - "observedAt"
    Assessment:
      type: "object"
      properties:
        id:
          type: "string"
        activityId:
          type: "string"
        courseId:
          type: "string"
        title:
          type: "string"
        type:
          "$ref": "#/components/schemas/AssessmentType"
        availableFrom:
          type: "string"
          description: "Moodle quiz or assignment opening time when known."
        sources:
          type: "array"
          items:
            "$ref": "#/components/schemas/SourceEvidence"
          minItems: 1
        submission:
          "$ref": "#/components/schemas/SubmissionObservation"
        personal:
          type: "boolean"
          default: false
        firstObservedAt:
          type: "string"
        lastObservedAt:
          type: "string"
      required:
        - "id"
        - "courseId"
        - "title"
        - "type"
        - "sources"
        - "personal"
        - "firstObservedAt"
        - "lastObservedAt"
    Overlay:
      type: "object"
      properties:
        assessmentId:
          type: "string"
        titleOverride:
          type: "string"
        dateOverride:
          "$ref": "#/components/schemas/DateValue"
        overrideBase:
          "$ref": "#/components/schemas/DateValue"
          description: "Source date when the override was set; used for change detection."
        hidden:
          type: "boolean"
          default: false
        completed:
          type: "boolean"
          default: false
      required:
        - "assessmentId"
        - "hidden"
        - "completed"
    OverlayPatch:
      type: "object"
      properties:
        titleOverride:
          oneOf:
            - type: "string"
            - type: "null"
        dateOverride:
          anyOf:
            - "$ref": "#/components/schemas/DateValue"
            - type: "null"
        overrideBase:
          anyOf:
            - "$ref": "#/components/schemas/DateValue"
            - type: "null"
        hidden:
          type: "boolean"
        completed:
          type: "boolean"
      description: "Omitted fields are unchanged. Explicit null clears an optional override; dateOverride null also clears overrideBase. A nonnull baseline together with dateOverride null is contradictory and rejected without mutation. Nonnull dates capture the latest source baseline. Nulls are commands only and never persist in Snapshot. The HTTP adapter translates explicitly present JavaScript undefined override keys into null. This coordinated additive reset representation preserves the existing UI behavior (#53/#58)."
