name: CI and publish
on:
  push:
    # production only moves to commits main already tested (promote.yml); nothing to rerun there.
    branches-ignore: [production]
  pull_request:
  # Manual run for any branch ("Use workflow from"): same tests, then publishes that commit's
  # image, so a branch can be deployed to dev by SHA (runbook section 10).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: shellcheck scripts/deploy.sh scripts/auto-deploy.sh
      - name: Verify the auto-deploy units as both instances
        run: |
          d=$(mktemp -d)
          for t in dev production; do
            cp 'scripts/moodlehelper-auto-deploy@.service' "$d/moodlehelper-auto-deploy@$t.service"
            cp 'scripts/moodlehelper-auto-deploy@.timer' "$d/moodlehelper-auto-deploy@$t.timer"
          done
          systemd-analyze verify "$d"/*
      # Contract tests run the frontend Zod models through Node (typescript, zod)
      # and the privacy review reads the built extension manifest.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run --cwd extension build
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # FastAPI integration tests (http-live, page-refresh) start the backend from the root .venv.
      - run: uv sync --locked
        working-directory: .
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./.playwright-browsers
      - run: uv run pytest tests/test_compose_integration.py
        env:
          MOODLE_HELPER_COMPOSE_TEST: '1'
      - run: node e2e/compose.cjs
      - name: Save tested image
        run: |
          image=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^moodlehelper-e2e-.*-app:latest$' | head -n 1)
          test -n "$image"
          docker tag "$image" moodlehelper:tested
          docker save moodlehelper:tested -o tested-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: tested-image.tar
          retention-days: 1
  publish:
    # Pushes the exact image the compose job tested; the VM pulls it by SHA (scripts/deploy.sh).
    # Automatically only for main; any branch only when started by hand.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - run: docker load -i tested-image.tar
      - name: Push tested image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo=ghcr.io/ramung55/moodlehelper
          # A SHA's image is immutable: deploys and rollbacks pull it by this tag, and promotion
          # moves exactly what dev ran. A re-run for a published commit never overwrites it.
          if docker manifest inspect "$repo:${GITHUB_SHA}" > /dev/null 2>&1; then
            echo "::notice::$repo:${GITHUB_SHA} already exists; not overwriting it"
            exit 0
          fi
          # Extra human-readable tag: UTC publish time and short SHA, e.g. 20261116-101500-cf4c688.
          readable="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          for tag in "${GITHUB_SHA}" "$readable"; do
            docker tag moodlehelper:tested "$repo:$tag"
            docker push "$repo:$tag"
          done
          echo "Published $repo:${GITHUB_SHA} and $repo:$readable" >> "$GITHUB_STEP_SUMMARY"
