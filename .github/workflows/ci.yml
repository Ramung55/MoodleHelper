name: CI and publish
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: shellcheck scripts/deploy.sh scripts/auto-deploy.sh
      - run: systemd-analyze verify scripts/moodlehelper-auto-deploy.service scripts/moodlehelper-auto-deploy.timer
      # Contract tests run the frontend Zod models through Node (typescript, zod)
      # and the privacy review reads the built extension manifest.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run --cwd extension build
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # FastAPI integration tests (http-live, page-refresh) start the backend from the root .venv.
      - run: uv sync --locked
        working-directory: .
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./.playwright-browsers
      - run: uv run pytest tests/test_compose_integration.py
        env:
          MOODLE_HELPER_COMPOSE_TEST: '1'
      - run: node e2e/compose.cjs
      - name: Save tested image
        run: |
          image=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^moodlehelper-e2e-.*-app:latest$' | head -n 1)
          test -n "$image"
          docker tag "$image" moodlehelper:tested
          docker save moodlehelper:tested -o tested-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: tested-image.tar
          retention-days: 1
  publish:
    # Pushes the exact image the compose job tested; the VM pulls it by SHA (scripts/deploy.sh).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - run: docker load -i tested-image.tar
      - name: Push tested image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/ramung55/moodlehelper:${GITHUB_SHA}"
          docker tag moodlehelper:tested "$image"
          docker push "$image"
