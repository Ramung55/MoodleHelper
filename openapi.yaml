      type: object
      additionalProperties: false
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/ScanPageRecord'
          maxItems: 100
        incompleteReasons: *id042
        nextCursor: *id030
        signInGuidance:
          type: string
          const: Sign in to SDU Moodle to continue.
        signInUrl:
          type: string
          const: https://moodle.sdu.edu.kz/login/index.php
      required:
      - pages
      - incompleteReasons
      description: Stable ordinal pagination. When any recorded or job-level reason
        is signed_out, both fixed sign-in fields are present; otherwise they are omitted.
        No DOM, secrets or exception text.
      allOf:
      - if:
          anyOf:
          - properties:
              incompleteReasons:
                contains:
                  const: signed_out
          - properties:
              pages:
                contains:
                  properties:
                    outcome:
                      const: signed_out
                  required:
                  - outcome
        then:
          required:
          - signInGuidance
          - signInUrl
        else:
          not:
            anyOf:
            - required:
              - signInGuidance
            - required:
              - signInUrl
