    ScanFinish:
      type: object
      additionalProperties: false
      properties:
        jobId: *id030
        generation: *id040
        token: *id030
        selectionRevision: *id041
        outcome:
          type: string
          enum:
          - completed
          - failed
        pages:
          type: array
          items:
            $ref: '#/components/schemas/ScanPageInput'
          maxItems: 100
        incompleteReasons: *id042
        errorCode: *id043
      required:
      - jobId
      - generation
      - token
      - selectionRevision
      - outcome
      - pages
      - incompleteReasons
      description: Atomically validate claim, live demand, synthetic context, selection
        and unique mapping; merge accepted source observations, store page coverage
        and finish. Stale or cancelled claims commit nothing. A completed job does
        not assert complete course coverage.
      allOf:
      - if:
          properties:
            outcome:
              const: failed
          required:
          - outcome
        then:
          required:
          - errorCode
        else:
          not:
            required:
            - errorCode
    ScanPageList:
      type: object
      additionalProperties: false
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/ScanPageRecord'
          maxItems: 100
        incompleteReasons: *id042
        nextCursor: *id030
        signInGuidance:
          type: string
          const: Sign in to SDU Moodle to continue.
        signInUrl:
          type: string
          const: https://moodle.sdu.edu.kz/login/index.php
      required:
      - pages
      - incompleteReasons
      description: Stable ordinal pagination. When any recorded or job-level reason
        is signed_out, both fixed sign-in fields are present; otherwise they are omitted.
        No DOM, secrets or exception text.
      allOf:
      - if:
          anyOf:
          - properties:
              incompleteReasons:
                contains:
                  const: signed_out
          - properties:
              pages:
                contains:
                  properties:
                    outcome:
                      const: signed_out
                  required:
                  - outcome
        then:
          required:
          - signInGuidance
          - signInUrl
        else:
          not:
            anyOf:
            - required:
              - signInGuidance
            - required:
              - signInUrl
    SyncUnavailableError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          const: Live course sync is unavailable until Moodle access is verified.
      required:
      - message
  responses:
    ProposedHttpFailure:
      description: Proposed HTTP failure convention only. The current frontend rejects
        promises or shows an Error.message; it does not define HTTP status codes or
        an error envelope. Inline domain outcomes such as unsupported imports/downloads
        remain successful 200 wrapper responses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProposedHttpError'
    BridgeContextChanged:
      description: Backend process changed; reconnect without replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProposedHttpError'
  parameters:
    BridgeBinding:
      name: X-Moodle-Helper-Bridge-Binding
      in: header
      required: false
      description: Optional process binding precondition. Absence preserves legacy
        clients; mismatch rejects before parsing or service work.
      schema:
        type: string
