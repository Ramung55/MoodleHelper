openapi: 3.1.0
info:
  title: Moodle Helper - proposed backend contract
  version: 0.1.0
  description: Local loopback API. Snapshot operations support the existing adapter;
    the durable synthetic queue is separate from Snapshot and does not access Moodle.
    The backend selects its namespace at startup. Queue mutations require the current
    process binding from /api/bridge-context; a stale or absent binding returns 409.
    A queue run reports counts and job states, not Moodle progress. Queue execution
    may repeat after interruption, while the result and completed state commit together.
    Requests and responses contain no credentials.
x-contract-status: implemented-local-api
x-source-files:
- frontend/src/services/adapter.ts
- frontend/src/services/index.ts
- frontend/src/services/demo-adapter.ts
- frontend/src/services/extension-adapter.ts
- frontend/src/domain/types.ts
- frontend/src/domain/backup.ts
- frontend/src/domain/extraction.ts
- frontend/src/lib/app-store.tsx
- frontend/src/routes/settings.tsx
- frontend/src/routes/syllabus.tsx
servers:
- url: /
  description: Placeholder relative origin for a future same-origin HTTP adapter;
    no backend host or API base is configured by the frontend.
security: []
tags:
- name: Connection
- name: Snapshot
- name: Courses
- name: Assessments
- name: Sync
- name: Documents
- name: Materials
- name: Alerts
- name: Settings
- name: Local data
- name: Demo
- name: AI availability
- name: Scan
paths:
  /api/local-syllabus/route:
    post:
      operationId: routeLocalSyllabus
      tags: [Documents]
      summary: Route locally retained syllabus proposals using derived metadata only
      description: >-
        Same-origin localhost ingestion, maximum 1048576 request bytes. Required
        process binding and dataset preconditions never select a namespace.
        No document bytes, filename, excerpt, raw date text, geometry or HTML.
        Local facts are pipeline assertions, not server verification of contents.
        Immutable input replay retains decisions; collisions return 409 atomically.
        This operation is not exposed through the Chrome extension transport.
      parameters:
      - name: X-Moodle-Helper-Bridge-Binding
        in: header
        required: true
        schema: {type: string}
        description: Required current process binding from /api/bridge-context.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocalSyllabusInput'}
      responses:
        '200':
          description: Atomic durable routes and authoritative Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalSyllabusResult'}
        '409': {$ref: '#/components/responses/ProposedHttpFailure'}
        '422': {$ref: '#/components/responses/ProposedHttpFailure'}
        default: {$ref: '#/components/responses/ProposedHttpFailure'}
  /api/local-context:
    get:
      operationId: localContext
      tags: [Local data]
      summary: Identify the current local dataset for browser storage
      description: >-
        Returns only an opaque random persistent dataset ID selected by the backend
        at startup. No client selector is accepted. This localhost endpoint is not
        authentication. Browser files remain scoped to their browser profile and
        dashboard origin and require separate backup or reselection.
      responses:
        '200':
          description: Current dataset identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datasetId]
                properties:
                  datasetId: {type: string}
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
  /api/syllabus-suggestions/dismissal:
    post:
      operationId: setSyllabusSuggestionDismissal
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
      tags: [Syllabus]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyllabusSuggestionDismissal'
      responses:
        '200':
          description: Updated snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '422':
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/ProposedHttpFailure'
  /api/syllabus-revisions/preview:
    post:
      operationId: previewSyllabusRevision
      tags: [Assessments]
      security: []
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyllabusRevisionSelection'}
      responses:
        '200':
          description: Reviewed evidence and a revision precondition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyllabusRevisionPreview'}
        '409': {$ref: '#/components/responses/ProposedHttpFailure'}
        default: {$ref: '#/components/responses/ProposedHttpFailure'}
  /api/syllabus-revisions/confirm:
    post:
      operationId: confirmSyllabusRevision
      tags: [Assessments]
      security: []
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyllabusRevisionDecision'}
      responses:
        '200':
          description: Updated Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '409': {$ref: '#/components/responses/ProposedHttpFailure'}
        default: {$ref: '#/components/responses/ProposedHttpFailure'}
  /api/reconciliation/pairs:
    post:
      operationId: proposeReconciliationPair
      tags: [Assessments]
      security: []
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconciliationSelection'}
      responses:
        '200':
          description: Updated Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '409': {$ref: '#/components/responses/ProposedHttpFailure'}
        default: {$ref: '#/components/responses/ProposedHttpFailure'}
  /api/reconciliation/decisions:
    post:
      operationId: decideReconciliationPair
      tags: [Assessments]
      security: []
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconciliationDecision'}
      responses:
        '200':
          description: Updated Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '409': {$ref: '#/components/responses/ProposedHttpFailure'}
        default: {$ref: '#/components/responses/ProposedHttpFailure'}
  /api/connection:
    get:
      operationId: connection
      tags:
      - Connection
      summary: Get adapter connection information
      description: No request body. Returns connection state, student-facing message,
        and extension detection flag. Current demo state remains 'demo' even if the
        UI independently detects an extension; detection alone does not enable live
        collection.
      security: []
      x-frontend-method: MoodleHelperAdapter.connection
      x-http-mapping: proposed
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionInfo'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/snapshot:
    get:
      operationId: load
      tags:
      - Snapshot
      summary: Load the complete dataset
      description: No request body. Returns the complete Snapshot consumed by AppProvider.
        The current implementation loads local demo fixtures or saved localStorage
        data.
      security: []
      x-frontend-method: MoodleHelperAdapter.load
      x-http-mapping: proposed
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
    put:
      operationId: replaceAll
      tags:
      - Snapshot
      summary: Atomically replace the dataset after restore validation
      description: Request body is a bare Snapshot, not the Backup {app,version,exportedAt,note,data}
        wrapper. Backup generation, file parsing, version checks, preview, and confirmation
        are client-local; settings.tsx passes preview.backup.data. DemoAdapter validates
        Snapshot with Zod before writing and rejects invalid input before mutation.
      security: []
      x-frontend-method: MoodleHelperAdapter.replaceAll
      x-http-mapping: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Snapshot'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/courses/discovery:
    post:
      operationId: ingestCourseDiscovery
      tags:
      - Courses
      summary: Atomically merge observed course facts
      description: Validate normalized nonblank known strings and nonempty known arrays,
        canonical positive decimal STRING IDs, exact canonical https://moodle.sdu.edu.kz/course/view.php?id=<sourceCourseId>
        URL at this ingestion boundary only. One latest-Snapshot store.mutate; trusted
        store namespace; no caller identity/tracking/current flag. Retain missing
        courses and all personal choices. New courses untracked with current=false,
        currentTermStatus=unknown. Reject ambiguous source mappings and deterministic
        identity collisions atomically. No coverage claim.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseDiscoveryInput'
      responses:
        '200':
          description: Confirmed Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '422': &id001
          $ref: '#/components/responses/ProposedHttpFailure'
        '503': *id001
        default: *id001
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/tracked-courses:
    put:
      operationId: setTrackedCourses
      tags:
      - Courses
      summary: Replace tracked course identifiers
      description: Request body is a bare string array, not an object wrapper. Empty
        selection is allowed by the adapter. Returns the updated complete Snapshot.
      security: []
      x-frontend-method: MoodleHelperAdapter.setTrackedCourses
      x-http-mapping: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/assessments/{assessmentId}/overlay:
    patch:
      operationId: updateOverlay
      tags:
      - Assessments
      summary: Update personal assessment overlay
      description: Patches the personal layer without mutating source evidence. Omitted
        properties remain unchanged. Explicit null clears titleOverride, dateOverride
        or overrideBase; clearing dateOverride also clears its baseline. Setting a
        nonnull dateOverride captures the latest effective source date. Clearing dateOverride
        while supplying a nonnull overrideBase is rejected atomically. Snapshot overlays
        never contain nulls.
      security: []
      x-frontend-method: MoodleHelperAdapter.updateOverlay
      x-http-mapping: proposed
      parameters:
      - name: assessmentId
        in: path
        required: true
        description: Assessment identifier passed as the first adapter argument.
        schema:
          type: string
      - $ref: '#/components/parameters/BridgeBinding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverlayPatch'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
  /api/personal-events:
    post:
      operationId: addPersonalEvent
      tags:
      - Assessments
      summary: Add a personal assessment
      description: Creates personal source evidence and returns the full updated Snapshot.
        The source contract requires courseId, title, type, and DateValue but does
        not impose a nonempty title or referential-integrity schema rule.
      security: []
      x-frontend-method: MoodleHelperAdapter.addPersonalEvent
      x-http-mapping: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalEventInput'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/personal-events/{id}:
    delete:
      operationId: deletePersonalEvent
      tags:
      - Assessments
      summary: Delete a personal assessment
      description: No request body. The current demo removes a matching assessment
        only if personal is true and removes the overlay with this id; missing ids
        are a no-op rather than a declared 404. Return the full updated Snapshot,
        not 204.
      security: []
      x-frontend-method: MoodleHelperAdapter.deletePersonalEvent
      x-http-mapping: proposed
      parameters:
      - name: id
        in: path
        required: true
        description: Personal assessment identifier.
        schema:
          type: string
      - $ref: '#/components/parameters/BridgeBinding'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
  /api/sync:
    post:
      operationId: syncAll
      tags:
      - Sync
      summary: Run the explicitly labeled demo sync
      description: No request body. The startup-selected demo dataset returns a final
        Snapshot with fictional simulated results; it does not contact Moodle. A non-demo
        dataset returns HTTP 503 with the fixed message "Live course sync is unavailable
        until Moodle access is verified." and changes no data or queue state. Clients
        cannot select the dataset in this request. Real Moodle sync is unavailable
        pending verified identity, site evidence and safe request authority.
      security: []
      x-frontend-method: MoodleHelperAdapter.syncAll
      x-http-mapping: proposed
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
        '503':
          description: Moodle sync is unavailable; no work was scheduled and no data
            changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncUnavailableError'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/documents/import:
    post:
      operationId: importDocument
      tags:
      - Documents
      summary: Legacy filename and optional digest mock import
      description: Filename and optional digest JSON, not a multipart
        file upload. Browser-local imports do not call this endpoint or send file bytes.
        Current demo only checks the extension (PDF/DOCX), simulates extraction, and
        adds a mocked candidate. Unsupported formats return 200 with result.ok=false
        and reason, not a fabricated HTTP validation error. onProgress callbacks are
        not transmitted; the response contains the final snapshot and result.
      security: []
      x-frontend-method: MoodleHelperAdapter.importDocument
      x-http-mapping: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDocumentInput'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDocumentResponse'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/candidates/{candidateId}/review:
    post:
      operationId: review
      tags:
      - Documents
      summary: Confirm, reject, or correct an extraction candidate
      description: >-
        Legacy/mock review behavior remains supported. A candidate with localEvidence
        requires localReview plus current process binding and dataset preconditions.
        Local decisions are metadata-only, strict, atomic and idempotent by decisionId
        and immutable server proposal fingerprint. Stored-only confirm/correct requires
        acknowledgement; unavailable evidence permits Reject only. Local unknown dates
        require explicit correction, never an invented current date. Local request
        size is bounded to 1048576 bytes. No excerpt/raw wording/geometry is accepted.
      security: []
      x-frontend-method: MoodleHelperAdapter.review
      x-http-mapping: proposed
      parameters:
      - name: candidateId
        in: path
        required: true
        description: Extraction candidate identifier.
        schema:
          type: string
      - name: X-Moodle-Helper-Bridge-Binding
        in: header
        required: false
        description: Optional for legacy/mock decisions; REQUIRED current process binding for registered local candidates.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
  /api/materials/{id}/download:
    post:
      operationId: downloadMaterial
      tags:
      - Materials
      summary: Request a material download capability outcome
      description: No request body. Return a JSON capability/result wrapper, not file
        bytes or a redirect. Current demo always returns supported=false, with a message
        distinguishing inaccessible resources from extension-required downloads; a
        missing resource follows the inaccessible result.
      security: []
      x-frontend-method: MoodleHelperAdapter.downloadMaterial
      x-http-mapping: proposed
      parameters:
      - name: id
        in: path
        required: true
        description: Material identifier.
        schema:
          type: string
      - $ref: '#/components/parameters/BridgeBinding'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadMaterialResponse'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
  /api/alerts:
    put:
      operationId: saveAlerts
      tags:
      - Alerts
      summary: Replace the persisted alert collection
      description: Request is a bare array of Alert records. It replaces the collection
        rather than appending one alert and returns the complete Snapshot. Eligibility
        calculations run in the frontend and are not another API operation.
      security: []
      x-frontend-method: MoodleHelperAdapter.saveAlerts
      x-http-mapping: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/settings:
    patch:
      operationId: updateSettings
      tags:
      - Settings
      summary: Shallow-update settings
      description: Top-level settings fields are optional. Nested weights, thresholds,
        reminders, or AI objects, when supplied, must be complete because the source
        type is shallow Partial<Settings> and the current implementation shallow-merges.
        No extra positivity constraints are added to numbers that the source schema
        leaves unconstrained.
      security: []
      x-frontend-method: MoodleHelperAdapter.updateSettings
      x-http-mapping: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/local-data:
    delete:
      operationId: deleteLocalData
      tags:
      - Local data
      summary: Clear the local dataset
      description: No request body. Return the post-deletion Snapshot. Current demo
        clears all record arrays and trackedCourseIds but retains the other settings;
        it does not delete Moodle records or disk files. No claim is made that the
        current demo implements background worker/alarm cleanup.
      security: []
      x-frontend-method: MoodleHelperAdapter.deleteLocalData
      x-http-mapping: proposed
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/demo/reset:
    post:
      operationId: resetDemo
      tags:
      - Demo
      summary: Reset fictional demo data (optional capability)
      description: No request body. This adapter method is optional and UI is shown
        only when it exists. It returns a fresh fictional demo Snapshot; it must not
        be assumed available on a production adapter. An HTTP implementation must
        agree how it advertises optional-method support before switching the current
        frontend; no capability-discovery endpoint is invented.
      security: []
      x-frontend-method: MoodleHelperAdapter.resetDemo
      x-http-mapping: proposed
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      x-optional-adapter-method: true
      x-demo-only: true
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/ai/availability:
    get:
      operationId: aiAvailability
      tags:
      - AI availability
      summary: Get AI availability and policy information
      description: No request body. An unavailable result requires reason; an available
        result requires provider and retention. Current demo always returns unavailable.
        There is no AI invocation/upload operation in this frontend, and settings.ai.enabled/consentGiven
        alone never send content.
      security: []
      x-frontend-method: MoodleHelperAdapter.aiAvailability
      x-http-mapping: proposed
      responses:
        '200':
          description: Final adapter return value (proposed HTTP success status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAvailability'
        default:
          $ref: '#/components/responses/ProposedHttpFailure'
        '409':
          $ref: '#/components/responses/BridgeContextChanged'
      parameters:
      - $ref: '#/components/parameters/BridgeBinding'
  /api/ai/extract:
    post:
      operationId: aiExtract
      tags: [AI availability]
      summary: Optional bounded AI extraction (ai-extract.v1, #42/#43)
      description: >-
        Localhost-only, consented excerpt transfer. Ordinary runtime has no provider
        and returns 503; only a trusted server construction can enable the local mock
        (no network, simulated cost). Required process binding and expectedDatasetId
        preconditions; 16 KiB body, 8 excerpts of at most 2000 UTF-8 bytes. Consent
        must bind the exact excerpts, context, destination and policy through
        payloadDigest. Failures use the error envelope with a fixed code and the
        request ID (413 payload, 429 rate/concurrency/budget, 502 provider/invalid
        output, 503 unavailable, 504 timeout); submitted text is never echoed.
        Proposals are unconfirmed and never change assessments. Evidence offsets are
        UTF-16 code units within the supplied excerpt text. Not exposed through the
        Chrome extension transport.
      parameters:
      - name: X-Moodle-Helper-Bridge-Binding
        in: header
        required: true
        schema: {type: string}
        description: Required current process binding from /api/bridge-context.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiExtractRequest'}
      responses:
        '200':
          description: Validated unconfirmed proposals from the local mock
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiExtractResponse'}
        '409': {$ref: '#/components/responses/ProposedHttpFailure'}
        '422': {$ref: '#/components/responses/ProposedHttpFailure'}
        default: {$ref: '#/components/responses/ProposedHttpFailure'}
  /api/bridge-context:
    get:
      operationId: bridgeContext
      tags:
      - Connection
      security: []
      responses:
